<a class="insight-card" href="{{ include.post.url | relative_url }}">
  {%- if include.post.image %}
  <div class="thumb"><img src="{{ include.post.image | relative_url }}" alt="" loading="lazy"></div>
  {%- endif %}
  <div class="body">
    <div class="insight-meta">
      {%- if include.post.category %}<span>{{ include.post.category }}</span><span class="sep">·</span>{% endif %}
      <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%b %-d, %Y" }}</time>
    </div>
    <h3>{{ include.post.title }}</h3>
    <p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 180 }}</p>
    <span class="learn">Read more →</span>
  </div>
</a>
